<VirtualHost *:80>
    ServerName yourdomain.com
    ServerAlias www.yourdomain.com

    DocumentRoot /var/www/shopaccount

    <Directory /var/www/shopaccount>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # SPA fallback — mọi route đều trả về index.html
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/shopaccount_error.log
    CustomLog ${APACHE_LOG_DIR}/shopaccount_access.log combined
</VirtualHost>
