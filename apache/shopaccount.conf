<VirtualHost *:80>
    ServerName shopaccgiare.tech
    ServerAlias www.shopaccgiare.tech

    DocumentRoot /var/www/shopaccount
    DirectoryIndex index.html

    <Directory /var/www/shopaccount>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On

        # Keep real files/directories unchanged (assets, images, JS, CSS...)
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # SPA fallback for client-side routes such as /admin
        RewriteRule ^ /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/shopaccount_error.log
    CustomLog ${APACHE_LOG_DIR}/shopaccount_access.log combined
</VirtualHost>
